name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/validate_dataset.py --quiet
      - run: python scripts/run_panel.py --models mockllm/model --answer-format letter --max-tokens 64 --log-dir logs/ci
      - run: python scripts/run_panel.py --models mockllm/model --answer-format letter --max-tokens 64 --log-dir logs/ci --resume
